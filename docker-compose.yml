services:

  # ─────────────────────────────────────────────
  # Base de datos MySQL 8
  # ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: rytmia_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rytmia_db
      MYSQL_USER: rytmia
      MYSQL_PASSWORD: rytmia_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"          # expuesto al host para DBeaver / TablePlus
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rytmia_net

  # ─────────────────────────────────────────────
  # Aplicación Laravel (PHP 8.3-FPM)
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: rytmia_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./.env.docker:/var/www/html/.env      # monta las variables como .env
      - app_storage:/var/www/html/storage
      - app_bootstrap:/var/www/html/bootstrap/cache
    networks:
      - rytmia_net

  # ─────────────────────────────────────────────
  # Servidor web Nginx
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: rytmia_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./laravel/public:/var/www/html/public:ro
    networks:
      - rytmia_net

# ─────────────────────────────────────────────
# Volúmenes persistentes
# ─────────────────────────────────────────────
volumes:
  mysql_data:
  app_storage:
  app_bootstrap:

# ─────────────────────────────────────────────
# Red interna
# ─────────────────────────────────────────────
networks:
  rytmia_net:
    driver: bridge
