services:
 # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: rytmia_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rytmia_db
      MYSQL_USER: rytmia
      MYSQL_PASSWORD: rytmia_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  # Comprueba si MySQL ya está listo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rytmia_net

 # Aplicación Laravel con PHP-FPM
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: rytmia_app
    restart: unless-stopped
# Laravel espera a que MySQL esté listo
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
   # Monta el archivo .env dentro de Laravel
      - ./.env:/var/www/html/.env
      - app_storage:/var/www/html/storage
  #guarda la cache de bootstrap para que no se pierda al reiniciar el contenedor
      - app_bootstrap:/var/www/html/bootstrap/cache
    networks:
      - rytmia_net

 # Monta el archivo .env dentro de Laravel
  nginx:
    image: nginx:alpine
    container_name: rytmia_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./laravel/public:/var/www/html/public:ro
    networks:
      - rytmia_net

    # Microservicio Python para generar PDFs

  pdf:
    build:
      context: ./laravel/rytmia_pdf
    container_name: rytmia_pdf
    restart: unless-stopped
    # El microservicio llama a Laravel usando el nombre del contenedor Nginx
    environment:
      - LARAVEL_BASE_URL=http://rytmia_nginx/api
    depends_on:
      - nginx
    ports:
      - "5000:5000"
    networks:
      - rytmia_net

# Volúmenes que no se pierden al reiniciar los contenedores
volumes:
  mysql_data:
  app_storage:
  app_bootstrap:

# Red interna para que los contenedores se comuniquen
networks:
  rytmia_net:
    driver: bridge